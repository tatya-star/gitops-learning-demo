apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tatya-star/gitops-learning-demo.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
