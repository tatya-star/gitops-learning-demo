name: Build and publish release dashboard

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "e2e/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, publish, and update desired state
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test deployment manifest update
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Chromium and Linux libraries
        run: npx playwright install --with-deps chromium

      - name: Test dashboard interactions
        run: npm run test:e2e

      - name: Resolve image name
        id: image_name
        shell: bash
        run: echo "name=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build static app
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_IMAGE_NAME: ${{ steps.image_name.outputs.name }}

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image_name.outputs.name }}
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --platform linux/amd64 \
            --tag "$image_ref" .
          candidate_name="release-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$candidate_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$candidate_name" --publish 127.0.0.1:4180:80 "$image_ref"
          RELEASE_CANDIDATE_URL=http://127.0.0.1:4180 npm run test:e2e -- --project=desktop --grep "initial render"
          docker push "$image_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Update desired image in Git
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: node scripts/update-deployment.mjs
