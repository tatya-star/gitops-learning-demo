apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-dashboard
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: release-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/tatya-star/gitops-learning-demo:5d4f3fee8727223025fed1126c03ada07c4eccf2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
